$kind: http-request
url: "{{baseUrl}}/rooms"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adm}}
body:
  type: json
  content: '{"room_number": "C{{sfx}}", "floor": 1, "price": 2000000}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 201', () => pm.response.to.have.status(201));
      const j = pm.response.json();
      pm.collectionVariables.set('rC', j.id);
    language: text/javascript
order: 7000
