$kind: http-request
url: "{{baseUrl}}/contracts/{{c3}}"
method: DELETE
headers:
  Content-Type: application/json
  Authorization: Bearer {{adm}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
        url: pm.collectionVariables.get('baseUrl') + '/invoices/' + pm.collectionVariables.get('i3'),
        method: 'DELETE',
        header: { Authorization: 'Bearer ' + pm.collectionVariables.get('adm') }
      }, () => {});
    language: text/javascript
  - type: afterResponse
    code: pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000
