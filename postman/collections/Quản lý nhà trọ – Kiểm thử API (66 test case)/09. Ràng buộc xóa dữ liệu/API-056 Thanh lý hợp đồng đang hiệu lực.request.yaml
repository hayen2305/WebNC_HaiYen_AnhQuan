$kind: http-request
url: "{{baseUrl}}/contracts/{{c1}}/terminate"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{adm}}
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
