$kind: http-request
url: "{{baseUrl}}/users/{{t2id}}/active"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{adm}}
body:
  type: json
  content: '{"is_active": false}'
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
