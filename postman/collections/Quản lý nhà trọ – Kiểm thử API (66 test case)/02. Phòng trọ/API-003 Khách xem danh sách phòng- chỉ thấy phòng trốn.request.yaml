$kind: http-request
name: "API-003 Khách xem danh sách phòng: chỉ thấy phòng trống"
url: "{{baseUrl}}/rooms"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{t1}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Tất cả phòng đều trống', () => pm.expect(j.every(r => r.status === 'EMPTY')).to.be.true);
    language: text/javascript
order: 1000
