$kind: http-request
url: "{{baseUrl}}/contracts/{{c1}}/approve"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{adm}}
body:
  type: json
  content: '{"deposit": 3000000}'
scripts:
