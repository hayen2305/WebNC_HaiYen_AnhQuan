$kind: http-request
url: "{{baseUrl}}/contracts/my"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{t1}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Đúng phòng đã thuê', () => pm.expect(j.room_id).to.eql(Number(pm.collectionVariables.get('rA'))));
    language: text/javascript
order: 11000
