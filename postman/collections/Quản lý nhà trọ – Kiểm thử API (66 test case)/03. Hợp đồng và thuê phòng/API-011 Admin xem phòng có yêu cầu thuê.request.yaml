$kind: http-request
url: "{{baseUrl}}/rooms/{{rA}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{adm}}
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('Có 2 yêu cầu đang chờ', () => pm.expect(j.pending_requests).to.eql(2));
    language: text/javascript
order: 6000
