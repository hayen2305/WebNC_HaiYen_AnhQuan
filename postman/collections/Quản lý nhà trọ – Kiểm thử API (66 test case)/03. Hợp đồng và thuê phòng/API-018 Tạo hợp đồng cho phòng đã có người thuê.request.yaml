$kind: http-request
url: "{{baseUrl}}/contracts"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adm}}
body:
  type: json
  content: '{"room_id": "{{rB}}", "tenant_id": "{{t1id}}", "rental_type": "DAILY", "start_date": "{{today}}", "days": 2}'
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 13000
