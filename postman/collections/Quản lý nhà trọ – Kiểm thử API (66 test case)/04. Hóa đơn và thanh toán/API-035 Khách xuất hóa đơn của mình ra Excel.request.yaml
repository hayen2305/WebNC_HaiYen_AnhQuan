$kind: http-request
url: "{{baseUrl}}/invoices/tenant/export"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{t1}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      pm.test('Đúng định dạng Excel', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('spreadsheetml'));
      const b = pm.response.stream;
      const a = b.data || b;
      pm.test('Tệp .xlsx hợp lệ (bắt đầu bằng PK)', () => {
        pm.expect(a[0]).to.eql(0x50);
        pm.expect(a[1]).to.eql(0x4B);
      });
    language: text/javascript
order: 16000
